<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Design, Written | Human by Design</title>
<meta name="description" content="Your whole Human Design chart, read for you, all the way down.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Reenie+Beanie&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Aref+Ruqaa:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="seal-64.png" type="image/png">
<script src="i18n.js"></script>
<style>
.mf{display:flex;flex-direction:column;gap:18px;margin-top:32px;padding:36px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 40px rgba(26,20,16,.06)}
.mf h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
.mf label{font-weight:500;font-size:14px;display:flex;flex-direction:column;gap:8px}
.mf input{height:52px;padding:0 16px;border:1px solid rgba(26,20,16,.35);border-radius:2px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:#fff}
.mf .row{display:flex;flex-wrap:wrap;gap:18px}.mf .row label{flex:1 1 200px}
.places{display:flex;flex-direction:column;gap:6px}
.places button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:#fff;font:inherit;font-size:15px;cursor:pointer}
.places button:hover{border-color:var(--red);background:#fbf1ec}
[dir=rtl] .places button{text-align:right}
.mf button.btn{align-self:flex-start}
.offer{margin-top:28px;padding:36px;background:var(--card);border:1px solid var(--line)}
.offer ul{margin:18px 0 0;padding-inline-start:20px}.offer li{margin:6px 0}
.offer .price{font-family:var(--serif);font-size:44px;margin:22px 0 4px;color:var(--red)}
.small-note{font-size:13px;color:var(--muted);margin-top:12px}
.err{color:var(--red);font-size:14px;min-height:1em}
.rep{display:none}.rep.on{display:block}
.rep h2{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1.1;margin:96px 0 18px;padding-top:28px;border-top:1px solid var(--line)}
.rep h3{font-family:var(--serif);font-weight:400;font-size:28px;margin:36px 0 8px}
.rep h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:500;margin:28px 0 6px}
.rep p{max-width:680px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:24px}
.fact{background:var(--card);border:1px solid var(--line);padding:16px 18px}
.fact .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fact .v{font-family:var(--serif);font-size:24px;line-height:1.15;margin-top:6px}
.cl{list-style:none;padding:0!important;margin:0}
.cl li{padding:20px 0;border-top:1px solid var(--line);break-inside:avoid}
.cl li strong{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin-bottom:6px}
.cl .meta{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cl .sub{display:block;margin-top:10px}
.cl .ask{display:block;margin-top:10px;font-family:var(--serif);font-style:italic;font-size:19px}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border:1px solid currentColor;margin-inline-start:8px;vertical-align:middle;font-family:Inter,sans-serif}
.tag.d{color:var(--red)}.tag.o{color:var(--muted)}
.act{display:grid;grid-template-columns:150px 1fr;gap:6px 22px}
.act .pl{font-weight:500}.act .pl small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.p-des .pl{color:#B8231B}
.callout{font-family:var(--serif);font-size:26px;line-height:1.3;margin:26px 0;padding-inline-start:20px;border-inline-start:3px solid var(--red)}
.crossname{font-family:var(--serif);font-size:32px;line-height:1.15;color:var(--red);margin-top:4px}
.keep{margin-top:48px;padding:24px;border:1px dashed var(--line);font-size:14px}
.keep input{width:100%;margin-top:8px;padding:10px;font:inherit;font-size:13px;border:1px solid var(--line);direction:ltr}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.chartbox{display:grid;grid-template-columns:auto minmax(0,460px) auto;gap:20px;justify-content:center;align-items:start;margin-top:28px;direction:ltr;padding:28px;background:var(--card);border:1px solid var(--line)}
.bgw svg{width:100%;height:auto;display:block}
.pcol{display:flex;flex-direction:column;gap:4px;min-width:96px}
.pcol .ph{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;margin-bottom:4px;text-align:center}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 10px;border-radius:2px;color:#fff;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.pr .gl{font-size:17px;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols',sans-serif}
.des .pr{background:#B8231B}.per .pr{background:#1A1410}.des .ph{color:#B8231B}
.cover{padding:56px 0 8px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1.02;margin:0}
.cover h1 i{color:var(--red)}
@media (max-width:760px){.chartbox{grid-template-columns:1fr 1fr;gap:12px;padding:16px}.bgw{grid-column:1/-1;grid-row:1;max-width:460px;margin:0 auto;width:100%}.pcol{min-width:0}.act{grid-template-columns:1fr}.cover h1{font-size:46px}.rep h2{font-size:36px}}
html[lang=ar] .rep h2,html[lang=ar] .rep h3,html[lang=ar] .crossname,html[lang=ar] .fact .v,html[lang=ar] .cl li strong,html[lang=ar] .cl .ask,html[lang=ar] .cover h1,html[lang=ar] .callout,html[lang=ar] .mf h3,html[lang=ar] .offer .price{font-family:'Amiri',serif}
html[lang=ar] .rep h4,html[lang=ar] .cl .meta,html[lang=ar] .fact .k,html[lang=ar] .pcol .ph,html[lang=ar] .tag{letter-spacing:0;text-transform:none}
@media print{body::after{display:none}header.nav,.acts,.keep,.no-print{display:none!important}.rep h2{break-before:page;margin-top:0}.chartbox,.fact{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
<header class="nav">
  <a class='logo' href='/'><img src="seal.png" alt="" width="38" height="37"><span dir="ltr">Human by Design</span></a>
  <nav class="nav-links"><button class="lang-btn" type="button" data-lang-toggle lang="ar" dir="rtl" aria-label="التبديل إلى العربية">عربي</button></nav>
</header>
</div>
<main class="guide">
<div id="gate" class="no-print"></div>
<div class="rep" id="rep"></div>
</main>
<form name="report-orders" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field"><input name="payment_intent"><input name="name"><input name="email"><input name="birth_date"><input name="birth_time"><input name="birth_place"><input name="timezone"><input name="language"><input name="type"><input name="authority"><input name="profile"><input name="report_url"><input name="paid_at"></form>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="hd-engine.js"></script>
<script src="hbd-data.js"></script>
<script src="ar-guide.js"></script>
<script src="report-en.js"></script>
<script src="report-ar.js"></script>
<script>
(function(){
// Arabic strings for the few data-i18n bits on this page (the report itself is rendered from HBR_AR).
window.HBD_I18N={'meta.title':'تصميمك، مكتوب | Human by Design'};

var BASE='https://humanbydesign.global/report.html';
var CHECKOUT='/.netlify/functions/checkout', VERIFY='/.netlify/functions/verify';
var ORDER=window.HBD_DRAW.ORDER, DR=window.HBD_DRAW;
var state={view:null,r:null,c:null,pi:null};

function lang(){return window.HBDL?window.HBDL():'en';}
function ar(){return lang()==='ar';}
function R(){return ar()?window.HBR_AR:window.HBR_EN;}
function B(){return ar()&&window.HBD_AR?window.HBD_AR:window.HBD_EN;}
function U(k){var v=R().UI[k];return v==null?window.HBR_EN.UI[k]:v;}
function tr(map,k){var m=B()[map];return m&&m[k]!=null?m[k]:k;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n(x){return '<bdi dir="ltr">'+x+'</bdi>';}
function gname(g){var x=B().GN[g]||window.HBD_EN.GN[g];return x?x[0]:'';}
function cname(c){return B().CNAME[c]||c;}
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}

function chartOf(r){var dp=r.d.split('-').map(Number),tp=r.t.split(':').map(Number);return HD.chart(HD.localToUtc(dp[0],dp[1],dp[2],tp[0],tp[1],r.z));}
function act(c){var A={};c.personality.forEach(function(a){(A[a.gate]=A[a.gate]||{p:[],d:[]}).p.push(a.planet);});c.design.forEach(function(a){(A[a.gate]=A[a.gate]||{p:[],d:[]}).d.push(a.planet);});return A;}

// ---------- bodygraph (same drawing as Meeting Your Design) ----------
function svg(c){var A=act(c),Rd='#B8231B',K='#1A1410',s='<svg class="bg" viewBox="0 0 500 852" role="img" aria-label="bodygraph">',o1='',o2='',o3='';
function f(x){return Math.round(x*10)/10;}
DR.CH.forEach(function(ch){var a=DR.GP[ch[0]],b=DR.GP[ch[1]],k=ch[0]+'-'+ch[1],q=DR.CTRL[k]||[(a[0]+b[0])/2,(a[1]+b[1])/2];
var m1=[(a[0]+q[0])/2,(a[1]+q[1])/2],m2=[(q[0]+b[0])/2,(q[1]+b[1])/2],mid=[(m1[0]+m2[0])/2,(m1[1]+m2[1])/2];
var full='M'+a+' Q'+q+' '+b;o1+='<path d="'+full+'" stroke="'+K+'" stroke-width="11" fill="none"/>';o2+='<path d="'+full+'" stroke="#fff" stroke-width="8" fill="none"/>';
[[ch[0],'M'+a+' Q'+m1.map(f)+' '+mid.map(f)],[ch[1],'M'+b+' Q'+m2.map(f)+' '+mid.map(f)]].forEach(function(h){var x=A[h[0]];if(!x)return;
if(x.d.length)o3+='<path d="'+h[1]+'" stroke="'+Rd+'" stroke-width="8" fill="none"/>';
if(x.p.length)o3+='<path d="'+h[1]+'" stroke="'+K+'" stroke-width="'+(x.d.length?3.5:8)+'" fill="none"/>';});});
s+=o1+o2+o3;
Object.keys(DR.SHP).forEach(function(k){s+='<path d="'+DR.SHP[k]+'" fill="'+(c.defined[k]?Rd:'#fff')+'" stroke="'+K+'" stroke-width="2.5" stroke-linejoin="round"/>';});
Object.keys(DR.GP).forEach(function(g){var p=DR.GP[g],x=A[g],def=c.defined[HD.GATE_CENTER[g]];
if(x)s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10.5" fill="'+K+'"/>';else if(def)s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10.5" fill="#fff"/>';
s+='<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="11" font-weight="'+(x?700:500)+'" fill="'+(x?'#fff':K)+'" font-family="Inter,sans-serif">'+g+'</text>';});
return s+'</svg>';}
function col(list,cls,label){return '<div class="pcol '+cls+'"><div class="ph">'+label+'</div>'+list.map(function(a,i){return '<div class="pr"><span class="gl">'+DR.GLY[i]+'︎</span><span>'+a.gate+'.'+a.line+'</span></div>';}).join('')+'</div>';}

// ---------- incarnation cross ----------
function cross(c){var d=B(),g=c.cross[0],p=c.pLine,dl=c.dLine,S=d.S||window.HBD_EN.S,E=window.HBD_EN.S;function s(k){return S[k]!=null?S[k]:E[k];}
if(p===4&&dl===1)return {name:s('juxName')(d.JXN[g]),theme:s('juxTheme')(d.GN[g][1]),txt:s('juxTxt')};
if(p>=5)return {name:s('laxName')(tr('LAXNM',DR.LAXG[g])),theme:s('laxTheme')(d.LAXN[DR.LAXG[g]]),txt:s('laxTxt')};
return {name:s('raxName')(tr('RAXNM',DR.RAXG[g])),theme:d.RAXN[DR.RAXG[g]],txt:s('raxTxt')};}

// ---------- the report ----------
function report(r,c){
var X=R(),EN=window.HBR_EN,A=act(c),T=X.TYPE[c.type],AU=X.AUTH[c.authority];
var tn=tr('TN',c.type),aun=tr('AUN',c.authority),dn=ORDER.filter(function(k){return c.defined[k];});
var h='<section class="cover"><p class="eyebrow">'+esc(U('docTitle'))+'</p><h1>'+U('forName')(esc(r.n))+'</h1>';
h+='<p class="lead" style="margin-top:18px">'+U('born')(esc(r.d),esc(r.t),esc(r.p))+'</p>';
h+='<div class="chartbox">'+col(c.design,'des',ar()?'Design':'Design')+'<div class="bgw">'+svg(c)+'</div>'+col(c.personality,'per','Personality')+'</div>';
var S=B().S||window.HBD_EN.S,ES=window.HBD_EN.S;function s(k){return S[k]!=null?S[k]:ES[k];}
h+='<div class="facts">'+[[s('fType'),esc(tn)],[s('fStrat'),esc(B().T[c.type].s)],[s('fAuth'),esc(aun)],[s('fProf'),n(c.profile)],[s('fSig'),esc(B().T[c.type].sig)],[s('fNs'),esc(B().T[c.type].ns)]].map(function(f){return '<div class="fact"><div class="k">'+f[0]+'</div><div class="v">'+f[1]+'</div></div>';}).join('')+'</div>';
h+='<p style="margin-top:36px">'+U('intro')+'</p><h3>'+U('howH')+'</h3><p>'+U('how')+'</p></section>';

// type
h+='<h2>'+U('partType')+': '+esc(tn)+'</h2>';
[['auraH','aura'],['stratH','strat'],['signsH','signs'],['workH','work'],['loveH','love'],['restH','rest']].forEach(function(p){h+='<h4>'+U(p[0])+'</h4><p>'+T[p[1]]+'</p>';});
// authority
h+='<h2>'+U('partAuth')+': '+esc(aun)+'</h2>';
[['feelH','feel'],['sceneH','scene'],['trapH','trap'],['practiceH','practice']].forEach(function(p){h+='<h4>'+U(p[0])+'</h4><p>'+AU[p[1]]+'</p>';});
// profile + definition
h+='<h2>'+U('partProf')(c.profile)+'</h2><p>'+(X.PROFILE[c.profile]||EN.PROFILE[c.profile])+'</p>';
h+='<h3>'+U('partDef')+'</h3><p>'+U('defIntro')+' '+X.DEF[c.definition]+'</p>';
// centres
h+='<h2>'+U('partCen')+'</h2><p>'+U('cenIntro')+'</p><ul class="cl">';
ORDER.forEach(function(k){var C=X.CENTRE[k],d=!!c.defined[k];
h+='<li><strong>'+esc(cname(k))+'<span class="tag '+(d?'d':'o')+'">'+U(d?'defined':'open')+'</span></strong><span class="meta">'+C.does+'</span>'+(d?C.def:C.open+'<span class="sub"><b>'+U('trap')+':</b> '+C.trap+'</span><span class="sub"><b>'+U('wisdom')+':</b> '+C.wisdom+'</span><span class="ask">'+U('ask')+': '+C.q+'</span>')+'</li>';});
h+='</ul>';
// channels
h+='<h2>'+U('partCh')+'</h2>';
if(!c.channels.length)h+='<p>'+U('chNone')+'</p>';else{h+='<ul class="cl">';
c.channels.forEach(function(ch){var k=ch.a+'-'+ch.b,cd=(B().CHD||{})[k]||window.HBD_EN.CHD[k],ci=EN.CH_CIRCUIT[k];
h+='<li><strong>'+n(k)+' '+s('chOf')(esc(cd[0]))+'</strong><span class="meta">'+s('fromTo')(cname(ch.from),cname(ch.to))+'</span>'+cd[1]+'<span class="sub"><b>'+U('circuit')+':</b> '+X.CIRCUIT[ci]+'</span><span class="ask">'+U('ask')+': '+cd[2]+'</span></li>';});
h+='</ul>';}
// hanging gates
var partner={};DR.CH.forEach(function(ch){(partner[ch[0]]=partner[ch[0]]||[]).push(ch[1]);(partner[ch[1]]=partner[ch[1]]||[]).push(ch[0]);});
var inCh={};c.channels.forEach(function(ch){inCh[ch.a]=1;inCh[ch.b]=1;});var hang=[];c.gates.forEach(function(g){if(inCh[g])return;(partner[g]||[]).forEach(function(o){hang.push([g,o]);});});
if(hang.length){h+='<h2>'+U('partHang')+'</h2><p>'+U('hangIntro')+'</p><ul class="cl">';
hang.forEach(function(x){h+='<li>'+U('hangLine')(x[0],esc(gname(x[0])),x[1],esc(gname(x[1])))+'</li>';});h+='</ul>';}
// activations
h+='<h2>'+U('partAct')+'</h2><p>'+U('actIntro')+'</p>';
[['personality',U('persSide'),'p-per'],['design',U('desSide'),'p-des']].forEach(function(side){
h+='<h3>'+side[1]+'</h3><ul class="cl '+side[2]+'">';
c[side[0]].forEach(function(a){h+='<li class="act"><div class="pl">'+esc(tr('PL',a.planet))+'<small>'+n(a.gate+'.'+a.line)+'</small></div><div><strong style="font-size:21px">'+s('gateN')(a.gate,esc(gname(a.gate)))+'</strong>'+X.PLANET[a.planet]+' '+X.GATE[a.gate]+'<span class="sub" style="color:var(--muted)">'+X.LINE[a.line]+'</span></div></li>';});
h+='</ul>';});
// cross
var x=cross(c);h+='<h2>'+U('partCross')+'</h2><p class="crossname">'+x.name+'</p><p>'+U('crossIntro')+'</p><p class="callout">'+x.theme+'</p><p>'+x.txt+'</p>';
// experiments
var op=ORDER.filter(function(k){return !c.defined[k];});
h+='<h2>'+U('partLive')+'</h2><p>'+U('liveIntro')+'</p><ul class="cl"><li><strong>'+esc(tn)+'</strong>'+X.EXP[c.type]+'</li><li><strong>'+esc(aun)+'</strong>'+AU.practice+'</li>';
op.slice(0,2).forEach(function(k){h+='<li><strong>'+esc(cname(k))+'</strong><span class="ask" style="margin-top:0">'+X.CENTRE[k].q+'</span></li>';});
if(hang[0])h+='<li><strong>'+s('gateN')(hang[0][0],esc(gname(hang[0][0])))+'</strong>'+U('hangLine')(hang[0][0],esc(gname(hang[0][0])),hang[0][1],esc(gname(hang[0][1])))+'</li>';
h+='</ul>';
// close
h+='<h2>'+U('closeH')+'</h2><p>'+U('close')+'</p><p style="margin-top:28px">'+U('love')+'</p><p style="margin-top:24px;font-size:14px;color:#555"><em>'+U('disc')+'</em></p>';
h+='<div class="acts"><button class="btn" type="button" onclick="window.print()">'+U('pdf')+'</button></div>';
if(state.pi)h+='<div class="keep">'+U('keep')+'<input readonly value="'+esc(location.href)+'" onclick="this.select()"></div>';
return h;}

function showReport(r){var c=chartOf(r);state.view='report';state.r=r;state.c=c;
document.getElementById('gate').innerHTML='';var el=document.getElementById('rep');el.innerHTML=report(r,c);el.classList.add('on');
document.title=U('docTitle')+': '+r.n+' | Human by Design';}

// ---------- locked view: offer + form ----------
var sel=null,timer=null;
function offer(prefill){state.view='offer';var L=U('lockedList');
var h='<section class="cover"><p class="eyebrow">'+U('price')+'</p><h1>'+U('lockedH')+'</h1><p class="lead" style="margin-top:18px">'+U('lockedLead')+'</p></section>';
h+='<div class="offer"><ul>'+L.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p class="price">'+U('price')+'</p><p class="small-note">'+U('buyNote')+'</p></div>';
h+='<form class="mf" id="f" autocomplete="on"><h3>'+U('formH')+'</h3>';
h+='<label>'+U('name')+'<input id="nm" autocomplete="given-name" required></label><label>'+U('email')+'<input id="em" type="email" autocomplete="email" required dir="ltr"></label>';
h+='<div class="row"><label>'+U('date')+'<input id="bd" type="date" required></label><label>'+U('time')+'<input id="bt" type="time" required></label></div>';
h+='<label>'+U('place')+'<input id="bp" autocomplete="off" required placeholder="'+esc(U('placeph'))+'"></label><div class="places" id="pl"></div>';
h+='<p class="err" id="er" role="alert"></p><button class="btn" type="submit">'+U('buy')+' · '+U('price')+'</button></form>';
document.getElementById('rep').classList.remove('on');document.getElementById('gate').innerHTML=h;wire(prefill);}

function wire(pre){var bp=document.getElementById('bp'),pl=document.getElementById('pl'),er=document.getElementById('er');
if(pre){document.getElementById('nm').value=pre.n||'';document.getElementById('bd').value=pre.d||'';document.getElementById('bt').value=pre.t||'';bp.value=pre.p||'';if(pre.e)document.getElementById('em').value=pre.e;if(pre.z)sel={timezone:pre.z,_label:pre.p};}
bp.addEventListener('input',function(){sel=null;clearTimeout(timer);var q=bp.value.trim();if(q.length<2){pl.innerHTML='';return;}
timer=setTimeout(function(){fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language='+(ar()?'ar':'en')+'&format=json&name='+encodeURIComponent(q)).then(function(x){return x.json();}).then(function(j){pl.innerHTML='';
(j.results||[]).forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=[p.name,p.admin1,p.country].filter(Boolean).join(ar()?'، ':', ');b.onclick=function(){sel=p;bp.value=b.textContent;pl.innerHTML='';};pl.appendChild(b);});}).catch(function(){er.textContent=U('geo');});},300);});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();er.textContent='';
var r={n:document.getElementById('nm').value.trim(),e:document.getElementById('em').value.trim(),d:document.getElementById('bd').value,t:document.getElementById('bt').value,p:bp.value.trim()};
if(!r.n||!r.e||!r.d||!r.t||!r.p){er.textContent=U('need');return;}
if(!sel||!sel.timezone){er.textContent=U('pick');return;}
r.z=sel.timezone;try{chartOf(r);}catch(x){er.textContent=U('err');return;}
var enc=b64u(JSON.stringify(r)),btn=this.querySelector('button[type=submit]');btn.disabled=true;
fetch(CHECKOUT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r:enc,lang:lang()})}).then(function(x){if(!x.ok)throw 0;return x.json();})
.then(function(j){if(!j.redirect_url)throw 0;location.href=j.redirect_url;}).catch(function(){btn.disabled=false;er.textContent=U('err');});});}

// ---------- after payment ----------
function saveOrder(r,c){try{if(sessionStorage.getItem('hbr-saved-'+state.pi))return;sessionStorage.setItem('hbr-saved-'+state.pi,'1');}catch(x){}
var f={'form-name':'report-orders','payment_intent':state.pi,'name':r.n,'email':r.e||'','birth_date':r.d,'birth_time':r.t,'birth_place':r.p,'timezone':r.z,'language':lang(),'type':c.type,'authority':c.authority,'profile':c.profile,'report_url':location.href,'paid_at':new Date().toISOString()};
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:Object.keys(f).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(f[k]);}).join('&')}).catch(function(){});}

function start(){var q=new URLSearchParams(location.search),rq=q.get('r'),r=null;state.pi=q.get('pi');
if(rq){try{r=JSON.parse(unb64u(rq));}catch(x){r=null;}}
if(r&&state.pi){document.getElementById('gate').innerHTML='<p class="lead" style="margin-top:80px">'+U('checking')+'</p>';
fetch(VERIFY+'?pi='+encodeURIComponent(state.pi)+'&r='+encodeURIComponent(rq)).then(function(x){return x.json();}).then(function(j){
if(j&&j.paid){showReport(r);saveOrder(r,state.c);}else{offer(r);document.getElementById('er').textContent=U('notPaid');}}).catch(function(){offer(r);document.getElementById('er').textContent=U('notPaid');});}
else offer(r);}

window.HBD_onLang=function(){if(state.view==='report')showReport(state.r);else if(state.view==='offer'){var pre=null;try{pre={n:document.getElementById('nm').value,e:document.getElementById('em').value,d:document.getElementById('bd').value,t:document.getElementById('bt').value,p:document.getElementById('bp').value,z:sel&&sel.timezone};}catch(x){}offer(pre);}};
// For Cici's own previews and testing only (no payment check): HBR_preview({n,d,t,z,p})
window.HBR_preview=showReport;
start();
})();
</script>
