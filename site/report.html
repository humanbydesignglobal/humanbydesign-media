<html lang="en" translate="no">
<head>
<meta charset="utf-8">

<title>Your Design, Decoded | Human by Design</title>

<style>
/* ---------- Your Design, Decoded: brand layout (content/branding.md) ---------- */
.mf{display:flex;flex-direction:column;gap:18px;margin-top:32px;padding:36px;background:var(--card);border:1px solid var(--line);box-shadow:0 20px 40px rgba(26,20,16,.06)}
.mf h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0}
.mf label{font-weight:500;font-size:14px;display:flex;flex-direction:column;gap:8px}
.mf input{height:52px;padding:0 16px;border:1px solid rgba(26,20,16,.35);border-radius:2px;font:inherit;font-size:16px;font-weight:400;color:var(--ink);background:#fff}
.mf .row{display:flex;flex-wrap:wrap;gap:18px}.mf .row label{flex:1 1 200px}
.places{display:flex;flex-direction:column;gap:6px}
.places button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:2px;background:#fff;font:inherit;font-size:15px;cursor:pointer}
.places button:hover{border-color:var(--red);background:#fbf1ec}
[dir=rtl] .places button{text-align:right}
.mf button.btn{align-self:flex-start}
.offer{margin-top:28px;padding:36px;background:var(--card);border:1px solid var(--line)}
.offer ul{margin:18px 0 0;padding-inline-start:20px}.offer li{margin:8px 0;line-height:1.6}
.offer .price{font-family:var(--serif);font-size:44px;margin:22px 0 4px;color:var(--red)}
.small-note{font-size:13px;color:var(--muted);margin-top:12px}
.err{color:var(--red);font-size:14px;min-height:1em}

.rep{display:none}.rep.on{display:block}
.rep p,.rep li{font-size:16.5px;line-height:1.75;color:#2e2620}
.rep p{max-width:660px;margin:0 0 14px}
.hand{font-family:var(--hand);color:var(--red);font-size:40px;line-height:1;display:inline-block;transform:rotate(-4deg)}
html[lang=ar] .hand{font-family:'Aref Ruqaa',serif;font-size:30px}

/* espresso pages: cover, chapter heads, closing */
.dk{background:var(--esp);color:var(--cream);position:relative;overflow:hidden}
.dk::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 22%,rgba(255,180,110,.20),rgba(0,0,0,0) 60%);pointer-events:none}
.dk::after{content:"";position:absolute;inset:0;background:var(--grain);opacity:.16;mix-blend-mode:screen;pointer-events:none}
.dk>*{position:relative;z-index:1}
.dk .hand{color:var(--red-d)}
.dk p{color:var(--muted-d)}
.cover{min-height:92vh;padding:72px 64px;display:flex;flex-direction:column;justify-content:space-between;margin-top:8px}
.cover .eyebrow{color:var(--muted-d)}
.cover h1{font-family:var(--serif);font-weight:400;font-size:84px;line-height:.98;letter-spacing:-.02em;color:var(--cream);margin:26px 0 0}
.cover h1 i.u{background-image:var(--ul-d)}
.cover .who{margin-top:34px}
.cover .who .hand{font-size:58px;transform:none}
.cover .born{margin-top:18px;font-size:16px;color:var(--muted-d)}
.cover .seal{width:220px;height:auto;align-self:flex-end;margin-top:30px;filter:drop-shadow(0 18px 28px rgba(0,0,0,.45))}
.cover .site{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d)}
html[lang=ar] .cover h1{font-family:'Amiri',serif;font-size:72px;line-height:1.25}
html[lang=ar] .cover .seal{align-self:flex-start}

.chap{padding:52px 48px 44px;margin:120px 0 40px}
.chap .eyebrow{color:var(--muted-d)}
.chap h2{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.02;color:var(--cream);margin:14px 0 0}
.chap h2 i.u{background-image:var(--ul-d)}
.chap .hand{position:absolute;inset-inline-end:44px;top:40px;font-size:38px;transform:rotate(5deg)}
.chap p.ci{color:var(--muted-d);margin:22px 0 0;max-width:600px;font-size:16.5px;line-height:1.7}
html[lang=ar] .chap h2{font-family:'Amiri',serif;font-size:48px;line-height:1.3}

.blk{margin:0 0 26px;break-inside:avoid;page-break-inside:avoid}
.blk h4{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:500;margin:0 0 8px}
.blk h3{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.1;margin:0 0 10px}
.rep h3.sub{font-family:var(--serif);font-weight:400;font-size:34px;margin:48px 0 14px}
.callout{font-family:var(--serif);font-size:26px;line-height:1.35;margin:10px 0 24px;padding-inline-start:20px;border-inline-start:3px solid var(--red);max-width:640px;color:var(--ink)}
.sum p{font-size:18px;line-height:1.7;margin:0 0 12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 8px}
.fact{background:var(--card);border:1px solid var(--line);padding:14px 16px;break-inside:avoid}
.fact .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.fact .v{font-family:var(--serif);font-size:22px;line-height:1.15;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);padding:24px 26px;margin:0 0 16px;break-inside:avoid;page-break-inside:avoid}
.card .t{font-family:var(--serif);font-size:26px;line-height:1.15;margin:0 0 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .m{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card p{margin:0 0 10px}
.card .lbl{font-weight:500;color:var(--ink)}
.card .ask{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink);margin:6px 0 0}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border:1px solid currentColor;border-radius:99px}
.tag.d{color:var(--red)}.tag.o{color:var(--muted)}
.act{display:grid;grid-template-columns:120px 1fr;gap:4px 22px}
.act .pl{font-weight:500;font-size:15px}.act .pl small{display:block;color:var(--muted);font-weight:400;font-size:13px;margin-top:2px}
.p-des .act .pl{color:var(--red)}
.q{list-style:none;padding:0;margin:0}
.q li{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.4;padding:12px 0;border-top:1px solid var(--line);break-inside:avoid}
.crossname{font-family:var(--serif);font-size:34px;line-height:1.15;color:var(--red);margin:0 0 12px}
.keep{margin-top:40px;padding:22px;border:1px dashed var(--line);font-size:14px}
.keep input{width:100%;margin-top:8px;padding:10px;font:inherit;font-size:13px;border:1px solid var(--line);direction:ltr}
.acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.chartbox{display:grid;grid-template-columns:auto minmax(0,400px) auto;gap:18px;justify-content:center;align-items:start;margin:24px 0;direction:ltr;padding:24px;background:var(--card);border:1px solid var(--line);break-inside:avoid}
.bgw svg{width:100%;height:auto;display:block}
.pcol{display:flex;flex-direction:column;gap:4px;min-width:90px}
.pcol .ph{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;margin-bottom:4px;text-align:center}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 9px;border-radius:2px;color:#fff;font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.pr .gl{font-size:16px;font-family:'Segoe UI Symbol','Apple Symbols','Noto Sans Symbols',sans-serif}
.des .pr{background:#B8231B}.per .pr{background:#1A1410}.des .ph{color:#B8231B}
.closing{padding:80px 56px;margin-top:120px;text-align:center}
.closing .seal{width:150px;margin:0 auto 26px;display:block;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
.closing h2{font-family:var(--serif);font-weight:400;font-size:46px;color:var(--cream);margin:0 0 18px}
.closing p{max-width:560px;margin:0 auto 14px;color:var(--muted-d);font-size:17px;line-height:1.75}
.closing .hand{font-size:52px;margin:24px 0 10px}
.closing .disc{font-size:12.5px;margin-top:36px;opacity:.8}
.closing .site{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-d);margin-top:26px}
html[lang=ar] .rep h3.sub,html[lang=ar] .blk h3,html[lang=ar] .crossname,html[lang=ar] .fact .v,html[lang=ar] .card .t,html[lang=ar] .card .ask,html[lang=ar] .callout,html[lang=ar] .q li,html[lang=ar] .mf h3,html[lang=ar] .offer .price,html[lang=ar] .closing h2{font-family:'Amiri',serif;font-style:normal}
html[lang=ar] .blk h4,html[lang=ar] .card .m,html[lang=ar] .fact .k,html[lang=ar] .pcol .ph,html[lang=ar] .tag,html[lang=ar] .cover .site,html[lang=ar] .closing .site{letter-spacing:0;text-transform:none}
html[lang=ar] .rep p,html[lang=ar] .rep li{font-family:'IBM Plex Sans Arabic',var(--sans);line-height:1.9}
@media (max-width:760px){.chartbox{grid-template-columns:1fr 1fr;gap:12px;padding:14px}.bgw{grid-column:1/-1;grid-row:1;max-width:420px;margin:0 auto;width:100%}.pcol{min-width:0}.act{grid-template-columns:1fr}.cover{padding:48px 28px}.cover h1{font-size:54px}.chap{padding:40px 26px}.chap h2{font-size:40px}.chap .hand{position:static;display:block;margin-top:14px}.facts{grid-template-columns:1fr 1fr}}

/* ---------- print / PDF ---------- */
@page{size:A4;margin:20mm 20mm 32mm 20mm}
@page :first{margin:0}
@media print{
  html,body{background:#fff!important}
  .card,.fact,.chartbox{background:#FBF8F4!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body::after{display:none}
  header.nav,.acts,.keep,.no-print{display:none!important}
  .wrap,.guide{max-width:none!important;padding:0!important;margin:0!important}
  .rep p,.rep li{font-size:10.5pt;line-height:1.65;orphans:4;widows:4}
  .card{padding:5mm 6mm;margin-bottom:4mm}
  .card .t{font-size:17pt}
  .act{display:block}
  .act .pl{display:inline-block;margin-bottom:2mm}.act .pl small{display:inline;margin-inline-start:6px}
  .blk{margin-bottom:5mm}
  .q li{font-size:14pt}
  .rep p,.rep li,.blk,.card,.fact,.chartbox,.callout,.q li{break-inside:avoid;page-break-inside:avoid}
  h2,h3,h4,.chap{break-after:avoid;page-break-after:avoid}
  .cover{width:210mm;height:296mm;min-height:0;margin:0;padding:30mm 24mm 26mm;break-after:page}
  .cover h1{font-size:60pt}
  .cover .seal{width:58mm}
  .pg{break-before:page;page-break-before:always}
  .chap{margin:0 0 12mm;padding:16mm 14mm 12mm}
  .chap h2{font-size:36pt}
  .chap .hand{top:12mm;inset-inline-end:14mm;font-size:24pt}
  .closing{margin:0;padding:40mm 20mm;min-height:240mm;display:flex;flex-direction:column;justify-content:center;break-before:page}
  .chartbox{padding:5mm;gap:4mm;grid-template-columns:auto 95mm auto}
  .pr{font-size:9pt;padding:2px 6px}
}
</style>
</head>
<body>
<div class="wrap">
<header class="nav">
  <a class='logo' href='/'><img src="seal.png" alt="" width="38" height="37"><span dir="ltr">Human by Design</span></a>
  <nav class="nav-links"><button class="lang-btn" type="button" data-lang-toggle lang="ar" dir="rtl" aria-label="التبديل إلى العربية">عربي</button></nav>

</div>
<main class="guide">

</main>
<form name="report-orders" data-netlify="true" netlify-honeypot="bot-field" hidden><input name="bot-field"><input name="payment_intent"><input name="name"><input name="email"><input name="birth_date"><input name="birth_time"><input name="birth_place"><input name="timezone"><input name="language"><input name="type"><input name="authority"><input name="profile"><input name="report_url"><input name="paid_at"></form>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script src="hd-engine.js"></script>
<script src="hbd-data.js"></script>

<script>
(function(){
// Arabic strings for the few data-i18n bits on this page (the report itself is rendered from HBR_AR).
window.HBD_I18N={'meta.title':'تصميمك، بالتفصيل | Human by Design'};

var BASE='https://humanbydesign.global/report.html';
var CHECKOUT='/.netlify/functions/checkout', VERIFY='/.netlify/functions/verify';
var ORDER=window.HBD_DRAW.ORDER, DR=window.HBD_DRAW;
var state={view:null,r:null,c:null,pi:null};

function lang(){return window.HBDL?window.HBDL():'en';}
function ar(){return lang()==='ar';}
function R(){return ar()?window.HBR_AR:window.HBR_EN;}
function B(){return ar()&&window.HBD_AR?window.HBD_AR:window.HBD_EN;}
function U(k){var v=R().UI[k];return v==null?window.HBR_EN.UI[k]:v;}
function tr(map,k){var m=B()[map];return m&&m[k]!=null?m[k]:k;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n(x){return '<bdi dir="ltr">'+x+'</bdi>';}
function gname(g){var x=B().GN[g]||window.HBD_EN.GN[g];return x?x[0]:'';}
function cname(c){return B().CNAME[c]||c;}
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}

function chartOf(r){var dp=r.d.split('-').map(Number),tp=r.t.split(':').map(Number);return HD.chart(HD.localToUtc(dp[0],dp[1],dp[2],tp[0],tp[1],r.z));}
function act(c){var A={};c.personality.forEach(function(a){(A[a.gate]=A[a.gate]||{p:[],d:[]}).p.push(a.planet);});c.design.forEach(function(a){(A[a.gate]=A[a.gate]||{p:[],d:[]}).d.push(a.planet);});return A;}

// ---------- bodygraph (same drawing as Meeting Your Design) ----------
function svg(c){var A=act(c),Rd='#B8231B',K='#1A1410',s='<svg class="bg" viewBox="0 0 500 852" role="img" aria-label="bodygraph">',o1='',o2='',o3='';
function f(x){return Math.round(x*10)/10;}
DR.CH.forEach(function(ch){var a=DR.GP[ch[0]],b=DR.GP[ch[1]],k=ch[0]+'-'+ch[1],q=DR.CTRL[k]||[(a[0]+b[0])/2,(a[1]+b[1])/2];
var m1=[(a[0]+q[0])/2,(a[1]+q[1])/2],m2=[(q[0]+b[0])/2,(q[1]+b[1])/2],mid=[(m1[0]+m2[0])/2,(m1[1]+m2[1])/2];
var full='M'+a+' Q'+q+' '+b;o1+='<path d="'+full+'" stroke="'+K+'" stroke-width="11" fill="none"/>';o2+='<path d="'+full+'" stroke="#fff" stroke-width="8" fill="none"/>';
[[ch[0],'M'+a+' Q'+m1.map(f)+' '+mid.map(f)],[ch[1],'M'+b+' Q'+m2.map(f)+' '+mid.map(f)]].forEach(function(h){var x=A[h[0]];if(!x)return;
if(x.d.length)o3+='<path d="'+h[1]+'" stroke="'+Rd+'" stroke-width="8" fill="none"/>';
if(x.p.length)o3+='<path d="'+h[1]+'" stroke="'+K+'" stroke-width="'+(x.d.length?3.5:8)+'" fill="none"/>';});});
s+=o1+o2+o3;
Object.keys(DR.SHP).forEach(function(k){s+='<path d="'+DR.SHP[k]+'" fill="'+(c.defined[k]?Rd:'#fff')+'" stroke="'+K+'" stroke-width="2.5" stroke-linejoin="round"/>';});
Object.keys(DR.GP).forEach(function(g){var p=DR.GP[g],x=A[g],def=c.defined[HD.GATE_CENTER[g]];
if(x)s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10.5" fill="'+K+'"/>';else if(def)s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="10.5" fill="#fff"/>';
s+='<text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="11" font-weight="'+(x?700:500)+'" fill="'+(x?'#fff':K)+'" font-family="Inter,sans-serif">'+g+'</text>';});
return s+'</svg>';}
function col(list,cls,label){return '<div class="pcol '+cls+'"><div class="ph">'+label+'</div>'+list.map(function(a,i){return '<div class="pr"><span class="gl">'+DR.GLY[i]+'︎</span><span>'+a.gate+'.'+a.line+'</span></div>';}).join('')+'</div>';}

// ---------- incarnation cross ----------
function cross(c){var d=B(),g=c.cross[0],p=c.pLine,dl=c.dLine,S=d.S||window.HBD_EN.S,E=window.HBD_EN.S;function s(k){return S[k]!=null?S[k]:E[k];}
if(p===4&&dl===1)return {name:s('juxName')(d.JXN[g]),theme:s('juxTheme')(d.GN[g][1]),txt:s('juxTxt')};
if(p>=5)return {name:s('laxName')(tr('LAXNM',DR.LAXG[g])),theme:s('laxTheme')(d.LAXN[DR.LAXG[g]]),txt:s('laxTxt')};
return {name:s('raxName')(tr('RAXNM',DR.RAXG[g])),theme:d.RAXN[DR.RAXG[g]],txt:s('raxTxt')};}

// ---------- the report ----------
var NOTES={en:{type:'(this is the big one)',auth:'(your inner yes)',prof:'(your role)',cen:'(where you are steady)',ch:'(your superpowers)',hang:'(people who click)',pl:'(read slowly)',act:'(one at a time)',cross:'(the big picture)',live:'(no schedule)'},
ar:{type:'(هيدا المهم)',auth:'(الإيه يلي جوّاتك)',prof:'(دورك)',cen:'(وين إنت ثابت)',ch:'(قواك الخارقة)',hang:'(ناس بيركبوا معك)',pl:'(إقرا عمهلك)',act:'(وحدة وحدة)',cross:'(الصورة الكبيرة)',live:'(بلا جدول)'}};
function note(k){return '<span class="hand">'+NOTES[ar()?'ar':'en'][k]+'</span>';}
function chap(eyebrow,title,nk,intro){return '<section class="chap dk pg"><p class="eyebrow">'+eyebrow+'</p><h2>'+title+'</h2>'+(nk?note(nk):'')+(intro?'<p class="ci">'+intro+'</p>':'')+'</section>';}
function blk(h,body){return '<div class="blk">'+(h?'<h4>'+h+'</h4>':'')+'<p>'+body+'</p></div>';}
function report(r,c){
var X=R(),EN=window.HBR_EN,T=X.TYPE[c.type],AU=X.AUTH[c.authority];
var tn=tr('TN',c.type),aun=tr('AUN',c.authority),dn=ORDER.filter(function(k){return c.defined[k];}),op=ORDER.filter(function(k){return !c.defined[k];});
var S=B().S||window.HBD_EN.S,ES=window.HBD_EN.S;function s(k){return S[k]!=null?S[k]:ES[k];}
var BT=B().T[c.type],LD=X.LINE_DEEP,h='';
// cover
h+='<section class="cover dk"><div><p class="eyebrow">Human by Design</p><h1>'+(ar()?'تصميمك،<br><i class="u">مكتوب.</i>':'your design,<br><i class="u">written.</i>')+'</h1>';
h+='<div class="who"><span class="hand">'+(ar()?'لـ':'for ')+esc(r.n)+'</span></div><p class="born">'+U('born')(esc(r.d),esc(r.t),esc(r.p))+'</p></div>';
h+='<img class="seal" src="seal.png" alt=""><p class="site">humanbydesign.global</p></section>';
// one page summary, then the chart
h+='<section class="sum pg"><h3 class="sub" style="margin-top:56px">'+U('summaryH')+'</h3><p>'+U('summaryIntro')+'</p>';
h+='<div class="blk"><p>'+U('sumType')(esc(tn),X.GIFT[c.type])+'</p><p>'+U('sumStrat')(esc(BT.s).toLowerCase())+'</p><p>'+U('sumAuth')(esc(aun))+'</p></div>';

h+='</div>';});

[ch.a,ch.b].forEach(function(g){h+='<p><span class="lbl">'+s('gateN')(g,esc(gname(g)))+':</span> '+X.GATE[g]+'</p>';});

// hanging gates
var partner={};DR.CH.forEach(function(ch){(partner[ch[0]]=partner[ch[0]]||[]).push(ch[1]);(partner[ch[1]]=partner[ch[1]]||[]).push(ch[0]);});

c[side[0]].forEach(function(a){h+='<div class="card act"><div class="pl">'+esc(tr('PL',a.planet))+'<small>'+n(a.gate+'.'+a.line)+'</small></div><div><div class="t" style="font-size:23px">'+s('gateN')(a.gate,esc(gname(a.gate)))+'</div><p>'+X.PLANET[a.planet]+' '+X.GATE[a.gate]+'</p><p><span class="lbl">'+U('lineWord')+' '+n(a.line)+':</span> '+X.LINE[a.line]+'</p><p style="color:var(--muted)"><span class="lbl">'+U('offH')+':</span> '+X.GATE_OFF[a.gate]+'</p></div></div>';});
h+='</div>';});
// cross

h+='<p>'+U('crossIntro')+'</p><p class="callout">'+x.theme+'</p><p>'+x.txt+'</p>';
[[s('pSun'),c.cross[0],s('pSunT')],[s('pEarth'),c.cross[1],s('pEarthT')],[s('dSun'),c.cross[2],s('dSunT')],[s('dEarth'),c.cross[3],s('dEarthT')]].forEach(function(q){h+='<div class="card"><span class="m">'+q[0]+'</span><div class="t">'+s('gateN')(q[1],esc(gname(q[1])))+'</div><p>'+q[2]+'</p><p>'+X.GATE[q[1]]+'</p></div>';});

op.forEach(function(k){h+='<div class="card"><div class="t">'+esc(cname(k))+'</div><p>'+X.CENTRE[k].practice+'</p><p class="ask">'+X.CENTRE[k].q+'</p></div>';});

function showReport(r){var c=chartOf(r);state.view='report';state.r=r;state.c=c;
document.getElementById('gate').innerHTML='';var el=document.getElementById('rep');el.innerHTML=report(r,c);el.classList.add('on');
document.title=U('docTitle')+': '+r.n+' | Human by Design';}

// ---------- locked view: offer + form ----------
var sel=null,timer=null;
function offer(prefill){state.view='offer';var L=U('lockedList');
var h='<section class="cover"><p class="eyebrow">'+U('launch')+' · '+U('price')+'</p><h1>'+U('lockedH')+'</h1><p class="lead" style="margin-top:18px">'+U('lockedLead')+'</p></section>';
h+='<div class="offer"><ul>'+L.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul><p class="price">'+U('price')+'</p><p class="small-note" style="margin-top:0">'+U('launch')+'</p><p class="small-note">'+U('buyNote')+'</p></div>';
h+='<form class="mf" id="f" autocomplete="on"><h3>'+U('formH')+'</h3>';
h+='<label>'+U('name')+'<input id="nm" autocomplete="given-name" required></label><label>'+U('email')+'<input id="em" type="email" autocomplete="email" required dir="ltr"></label>';
h+='<div class="row"><label>'+U('date')+'<input id="bd" type="date" required></label><label>'+U('time')+'<input id="bt" type="time" required></label></div>';
h+='<label>'+U('place')+'<input id="bp" autocomplete="off" required placeholder="'+esc(U('placeph'))+'"></label><div class="places" id="pl"></div>';
h+='<p class="err" id="er" role="alert"></p><button class="btn" type="submit">'+U('buy')+' · '+U('price')+'</button></form>';
document.getElementById('rep').classList.remove('on');document.getElementById('gate').innerHTML=h;wire(prefill);}

function wire(pre){var bp=document.getElementById('bp'),pl=document.getElementById('pl'),er=document.getElementById('er');
if(pre){document.getElementById('nm').value=pre.n||'';document.getElementById('bd').value=pre.d||'';document.getElementById('bt').value=pre.t||'';bp.value=pre.p||'';if(pre.e)document.getElementById('em').value=pre.e;if(pre.z)sel={timezone:pre.z,_label:pre.p};}
bp.addEventListener('input',function(){sel=null;clearTimeout(timer);var q=bp.value.trim();if(q.length<2){pl.innerHTML='';return;}
timer=setTimeout(function(){fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language='+(ar()?'ar':'en')+'&format=json&name='+encodeURIComponent(q)).then(function(x){return x.json();}).then(function(j){pl.innerHTML='';
(j.results||[]).forEach(function(p){var b=document.createElement('button');b.type='button';b.textContent=[p.name,p.admin1,p.country].filter(Boolean).join(ar()?'، ':', ');b.onclick=function(){sel=p;bp.value=b.textContent;pl.innerHTML='';};pl.appendChild(b);});}).catch(function(){er.textContent=U('geo');});},300);});
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();er.textContent='';
var r={n:document.getElementById('nm').value.trim(),e:document.getElementById('em').value.trim(),d:document.getElementById('bd').value,t:document.getElementById('bt').value,p:bp.value.trim()};
if(!r.n||!r.e||!r.d||!r.t||!r.p){er.textContent=U('need');return;}
if(!sel||!sel.timezone){er.textContent=U('pick');return;}
r.z=sel.timezone;try{chartOf(r);}catch(x){er.textContent=U('err');return;}
var enc=b64u(JSON.stringify(r)),btn=this.querySelector('button[type=submit]');btn.disabled=true;
fetch(CHECKOUT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({r:enc,lang:lang()})}).then(function(x){if(!x.ok)throw 0;return x.json();})
.then(function(j){if(!j.redirect_url)throw 0;location.href=j.redirect_url;}).catch(function(){btn.disabled=false;er.textContent=U('err');});});}

// ---------- after payment ----------
function saveOrder(r,c){try{if(sessionStorage.getItem('hbr-saved-'+state.pi))return;sessionStorage.setItem('hbr-saved-'+state.pi,'1');}catch(x){}
var f={'form-name':'report-orders','payment_intent':state.pi,'name':r.n,'email':r.e||'','birth_date':r.d,'birth_time':r.t,'birth_place':r.p,'timezone':r.z,'language':lang(),'type':c.type,'authority':c.authority,'profile':c.profile,'report_url':location.href,'paid_at':new Date().toISOString()};
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:Object.keys(f).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(f[k]);}).join('&')}).catch(function(){});}

function start(){var q=new URLSearchParams(location.search),rq=q.get('r'),r=null;state.pi=q.get('pi');
if(rq){try{r=JSON.parse(unb64u(rq));}catch(x){r=null;}}
if(r&&state.pi){document.getElementById('gate').innerHTML='<p class="lead" style="margin-top:80px">'+U('checking')+'</p>';
fetch(VERIFY+'?pi='+encodeURIComponent(state.pi)+'&r='+encodeURIComponent(rq)).then(function(x){return x.json();}).then(function(j){
if(j&&j.paid){showReport(r);saveOrder(r,state.c);}else{offer(r);document.getElementById('er').textContent=U('notPaid');}}).catch(function(){offer(r);document.getElementById('er').textContent=U('notPaid');});}
else offer(r);}

window.HBD_onLang=function(){if(state.view==='report')showReport(state.r);else if(state.view==='offer'){var pre=null;try{pre={n:document.getElementById('nm').value,e:document.getElementById('em').value,d:document.getElementById('bd').value,t:document.getElementById('bt').value,p:document.getElementById('bp').value,z:sel&&sel.timezone};}catch(x){}offer(pre);}};
// For Cici's own previews and testing only (no payment check): HBR_preview({n,d,t,z,p})
window.HBR_preview=showReport;
start();
})();
