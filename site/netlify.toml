# Netlify settings for humanbydesign.global (base directory: site)
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# The Human by Design app (web version), built from the app code (branch "app").
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200
